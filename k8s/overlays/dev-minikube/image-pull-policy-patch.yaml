apiVersion: apps/v1
kind: Deployment
metadata:
  name: collabboard-backend
  namespace: collabboard
spec:
  template:
    spec:
      containers:
        - name: api
          imagePullPolicy: IfNotPresent
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: collabboard-frontend
  namespace: collabboard
spec:
  template:
    spec:
      containers:
        - name: web
          imagePullPolicy: IfNotPresent
