apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: collabboard
resources:
  - ../../base
patchesStrategicMerge:
  - image-pull-policy-patch.yaml
secretGenerator:
  - name: collabboard-db-secret
    envs:
      - db-secret.env
  - name: collabboard-backend-secret
    envs:
      - backend-secret.env
generatorOptions:
  disableNameSuffixHash: true
