apiVersion: v1
kind: Service
metadata:
  name: collabboard-backend
  namespace: collabboard
  labels:
    app.kubernetes.io/name: collabboard
    app.kubernetes.io/component: backend
spec:
  selector:
    app.kubernetes.io/name: collabboard
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  type: ClusterIP
