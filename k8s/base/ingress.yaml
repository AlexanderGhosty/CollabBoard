apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: collabboard
  namespace: collabboard
  labels:
    app.kubernetes.io/name: collabboard
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: collabboard.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: collabboard-backend
                port:
                  name: http
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: collabboard-backend
                port:
                  name: http
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: collabboard-backend
                port:
                  name: http
          - path: /swagger
            pathType: Prefix
            backend:
              service:
                name: collabboard-backend
                port:
                  name: http
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: collabboard-backend
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: collabboard-frontend
                port:
                  name: http
