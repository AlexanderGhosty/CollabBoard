apiVersion: apps/v1
kind: Deployment
metadata:
  name: collabboard-backend
  namespace: collabboard
  labels:
    app.kubernetes.io/name: collabboard
    app.kubernetes.io/component: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: collabboard
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: collabboard
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: api
          image: collabboard-backend:local
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: API_PORT
              valueFrom:
                configMapKeyRef:
                  name: collabboard-backend-config
                  key: API_PORT
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: collabboard-backend-config
                  key: LOG_LEVEL
            - name: LOG_FORMAT
              valueFrom:
                configMapKeyRef:
                  name: collabboard-backend-config
                  key: LOG_FORMAT
            - name: LOG_OUTPUT
              valueFrom:
                configMapKeyRef:
                  name: collabboard-backend-config
                  key: LOG_OUTPUT
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: collabboard-backend-config
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: collabboard-backend-config
                  key: POSTGRES_PORT
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: collabboard-db-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: collabboard-db-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: collabboard-db-secret
                  key: POSTGRES_DB
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: collabboard-backend-secret
                  key: JWT_SECRET
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
