apiVersion: v1
kind: Service
metadata:
  name: collabboard-postgres
  namespace: collabboard
  labels:
    app.kubernetes.io/name: collabboard
    app.kubernetes.io/component: postgres
spec:
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
  selector:
    app.kubernetes.io/name: collabboard
    app.kubernetes.io/component: postgres
  type: ClusterIP
