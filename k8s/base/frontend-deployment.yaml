apiVersion: apps/v1
kind: Deployment
metadata:
  name: collabboard-frontend
  namespace: collabboard
  labels:
    app.kubernetes.io/name: collabboard
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: collabboard
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: collabboard
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: web
          image: collabboard-frontend:local
          imagePullPolicy: Always
          ports:
            - containerPort: 5173
              name: http
          env:
            - name: VITE_API_URL
              valueFrom:
                configMapKeyRef:
                  name: collabboard-frontend-config
                  key: VITE_API_URL
            - name: VITE_WS_URL
              valueFrom:
                configMapKeyRef:
                  name: collabboard-frontend-config
                  key: VITE_WS_URL
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 30
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
